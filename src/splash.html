<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #06070d;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            border: 1px solid rgba(139, 92, 246, 0.35);
            box-shadow: 0 0 35px rgba(139, 92, 246, 0.25), inset 0 0 20px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        /* Subtle galaxy nebula backdrop inside splash */
        .splash-bg {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 30%, rgba(139, 92, 246, 0.18) 0%, rgba(59, 130, 246, 0.08) 45%, transparent 70%);
            pointer-events: none;
        }

        .splash-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 88%;
            z-index: 2;
            text-align: center;
        }

        .icon-wrapper {
            position: relative;
            width: 84px;
            height: 84px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .icon-glow {
            position: absolute;
            inset: -8px;
            background: radial-gradient(circle, rgba(217, 70, 239, 0.45) 0%, rgba(99, 102, 241, 0.25) 50%, transparent 75%);
            border-radius: 50%;
            filter: blur(10px);
            animation: pulse-glow 2.4s ease-in-out infinite alternate;
        }

        .splash-icon {
            width: 76px;
            height: 76px;
            object-fit: contain;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.65));
            animation: float-icon 3s ease-in-out infinite alternate;
        }

        .logo-wrapper {
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .splash-logo {
            height: 48px;
            width: auto;
            max-width: 320px;
            object-fit: contain;
            filter: drop-shadow(0 0 16px rgba(192, 132, 252, 0.75));
        }

        .progress-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 999px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899, #06b6d4);
            background-size: 200% 100%;
            border-radius: 999px;
            box-shadow: 0 0 12px rgba(217, 70, 239, 0.85);
            transition: width 0.28s cubic-bezier(0.4, 0, 0.2, 1);
            animation: shimmer-gradient 2s linear infinite;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 0.8px;
        }

        .status-text {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            color: #cbd5e1;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #a855f7;
            box-shadow: 0 0 8px #a855f7;
            animation: blink 1s infinite alternate;
        }

        .status-percent {
            font-weight: 700;
            color: #a855f7;
            font-variant-numeric: tabular-nums;
        }

        .footer-tag {
            margin-top: 14px;
            font-size: 9.5px;
            color: #475569;
            letter-spacing: 1.5px;
            font-weight: 700;
            text-transform: uppercase;
        }

        @keyframes pulse-glow {
            0% { transform: scale(0.92); opacity: 0.6; }
            100% { transform: scale(1.12); opacity: 1; }
        }

        @keyframes float-icon {
            0% { transform: translateY(0px) rotate(-1deg); }
            100% { transform: translateY(-5px) rotate(1deg); }
        }

        @keyframes shimmer-gradient {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        @keyframes blink {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="splash-bg"></div>
    <div class="splash-container">
        <div class="icon-wrapper">
            <div class="icon-glow"></div>
            <img class="splash-icon" src="assets/cosmic-icon.png" alt="Cosmic Client Icon">
        </div>
        <div class="logo-wrapper">
            <img class="splash-logo" src="assets/cosmic-logo.png" alt="Cosmic Client">
        </div>
        <div class="progress-box">
            <div class="progress-track">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="status-row">
                <span class="status-text">
                    <span class="status-dot"></span>
                    <span id="statusText">INITIALIZING ENVIRONMENT...</span>
                </span>
                <span class="status-percent" id="percentText">0%</span>
            </div>
        </div>
        <div class="footer-tag">Off-Cloud Archive &bull; Built for Cosmonauts</div>
    </div>

    <script>
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        const percentText = document.getElementById('percentText');

        const steps = [
            { pct: 15, text: "INITIALIZING CLIENT CORE..." },
            { pct: 35, text: "VERIFYING OFFLINE ASSETS & SOUNDS..." },
            { pct: 60, text: "SYNCHRONIZING SCHEMATICS & PROFILES..." },
            { pct: 85, text: "LOADING BYTECODE OPTIMIZER..." },
            { pct: 100, text: "READY. STARTING COSMIC CLIENT..." }
        ];

        let currentStep = 0;
        function advance() {
            if (currentStep < steps.length) {
                const s = steps[currentStep];
                progressBar.style.width = s.pct + "%";
                percentText.textContent = s.pct + "%";
                statusText.textContent = s.text;
                currentStep++;
                const delay = currentStep === steps.length ? 300 : 250;
                setTimeout(advance, delay);
            }
        }
        setTimeout(advance, 80);
    </script>
</body>
</html>
